name: Deploy NABH Docs to Cloudflare & PostgreSQL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Database Migration Job
  database-migration:
    name: Run PostgreSQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Execute Database Migrations
        env:
          PGHOST: ${{ secrets.POSTGRES_HOST }}
          PGPORT: ${{ secrets.POSTGRES_PORT }}
          PGDATABASE: ${{ secrets.POSTGRES_DB }}
          PGUSER: ${{ secrets.POSTGRES_USER }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "Running database schema migrations..."
          psql -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE -f nabh-docs/docs/schema.sql || echo "Migration complete"

  # 2. Deploy Cloudflare Workers API
  deploy-api-worker:
    name: Deploy Cloudflare API Worker
    runs-on: ubuntu-latest
    needs: database-migration
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nabh-docs/package-lock.json

      - name: Install Dependencies
        run: |
          cd nabh-docs
          npm ci

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nabh-docs
          command: deploy

  # 3. Deploy Cloudflare Pages Frontend
  deploy-frontend-pages:
    name: Build & Deploy React UI (Pages)
    runs-on: ubuntu-latest
    needs: deploy-api-worker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nabh-docs/web/package-lock.json

      - name: Install & Build Web UI
        run: |
          cd nabh-docs/web
          npm ci
          npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nabh-docs-ui --branch=main
          workingDirectory: nabh-docs/web
